<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="785" viewBox="0 0 1440 785" role="img" aria-labelledby="title desc"><title id="title">같은 응답 패킷도 보안 계층마다 처리 방식이 다릅니다</title><desc id="desc">같은 응답 패킷도 보안 계층마다 처리 방식이 다릅니다</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526c86"/></marker><marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#c44242"/></marker></defs><g font-family="Malgun Gothic, Noto Sans CJK KR, Arial, sans-serif"><rect width="1440" height="785" rx="20" fill="#ffffff"/><rect x="1" y="1" width="1438" height="783" rx="20" fill="none" stroke="#dce5ef"/><text x="42" y="55" text-anchor="start" font-size="30" font-weight="700" fill="#142a45"><tspan x="42" dy="0">같은 응답 패킷도 보안 계층마다 처리 방식이 다릅니다</tspan></text><rect x="35" y="130" width="1370" height="260" rx="18" fill="#edf5ff"/><text x="60" y="172" text-anchor="start" font-size="28" font-weight="700" fill="#2b6cb0"><tspan x="60" dy="0">Security Group · Stateful</tspan></text><rect x="70" y="210" width="300" height="120" rx="18" fill="#ebf8f1" stroke="#21865b" stroke-width="2"/><rect x="88" y="226" width="28" height="4" rx="2" fill="#21865b"/><text x="220" y="255" text-anchor="middle" font-size="25" font-weight="700" fill="#172b45"><tspan x="220" dy="0">요청 시작 측</tspan></text><text x="220" y="297" text-anchor="middle" font-size="20" font-weight="400" fill="#486078"><tspan x="220" dy="0">Private Instance</tspan></text><rect x="1070" y="210" width="300" height="120" rx="18" fill="#edf5ff" stroke="#2b6cb0" stroke-width="2"/><rect x="1088" y="226" width="28" height="4" rx="2" fill="#2b6cb0"/><text x="1220" y="255" text-anchor="middle" font-size="25" font-weight="700" fill="#172b45"><tspan x="1220" dy="0">요청 수신 측</tspan></text><text x="1220" y="297" text-anchor="middle" font-size="20" font-weight="400" fill="#486078"><tspan x="1220" dy="0">Test Instance</tspan></text><path d="M370,243 L1070,243" fill="none" stroke="#526c86" stroke-width="3"  marker-end="url(#arrow)"/><text x="720" y="231" text-anchor="middle" font-size="21" font-weight="400" fill="#486078"><tspan x="720" dy="0">요청에 대한 허용 규칙 확인</tspan></text><path d="M1070,300 L370,300" fill="none" stroke="#526c86" stroke-width="3"  marker-end="url(#arrow)"/><text x="720" y="288" text-anchor="middle" font-size="21" font-weight="700" fill="#2b6cb0"><tspan x="720" dy="0">허용된 요청의 응답은 자동 허용</tspan></text><rect x="35" y="420" width="1370" height="260" rx="18" fill="#f4efff"/><text x="60" y="462" text-anchor="start" font-size="28" font-weight="700" fill="#7752b3"><tspan x="60" dy="0">Network ACL · Stateless</tspan></text><rect x="70" y="500" width="300" height="120" rx="18" fill="#ebf8f1" stroke="#21865b" stroke-width="2"/><rect x="88" y="516" width="28" height="4" rx="2" fill="#21865b"/><text x="220" y="545" text-anchor="middle" font-size="25" font-weight="700" fill="#172b45"><tspan x="220" dy="0">요청 시작 측</tspan></text><text x="220" y="587" text-anchor="middle" font-size="20" font-weight="400" fill="#486078"><tspan x="220" dy="0">Private Instance</tspan></text><rect x="1070" y="500" width="300" height="120" rx="18" fill="#edf5ff" stroke="#2b6cb0" stroke-width="2"/><rect x="1088" y="516" width="28" height="4" rx="2" fill="#2b6cb0"/><text x="1220" y="545" text-anchor="middle" font-size="25" font-weight="700" fill="#172b45"><tspan x="1220" dy="0">요청 수신 측</tspan></text><text x="1220" y="587" text-anchor="middle" font-size="20" font-weight="400" fill="#486078"><tspan x="1220" dy="0">Test Instance</tspan></text><path d="M370,533 L1070,533" fill="none" stroke="#526c86" stroke-width="3"  marker-end="url(#arrow)"/><text x="720" y="521" text-anchor="middle" font-size="21" font-weight="400" fill="#486078"><tspan x="720" dy="0">요청 방향 규칙 확인</tspan></text><path d="M1070,590 L370,590" fill="none" stroke="#526c86" stroke-width="3"  marker-end="url(#arrow)"/><text x="720" y="578" text-anchor="middle" font-size="21" font-weight="700" fill="#7752b3"><tspan x="720" dy="0">요청과 응답을 각각 규칙으로 허용</tspan></text><text x="45" y="745" text-anchor="start" font-size="24" font-weight="400" fill="#486078"><tspan x="45" dy="0">실제 통신은 경로상의 Security Group과 Network ACL을 모두 통과해야 합니다.</tspan></text></g></svg>