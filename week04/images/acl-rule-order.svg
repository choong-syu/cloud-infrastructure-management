<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="398" viewBox="0 0 1440 398" role="img" aria-labelledby="title desc"><title id="title">Network ACL 규칙 평가 순서</title><desc id="desc">규칙 번호가 낮은 순서로 평가하며, 처음 일치한 규칙을 적용합니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526c86"/></marker><marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#c44242"/></marker></defs><g font-family="Malgun Gothic, Noto Sans CJK KR, Arial, sans-serif"><rect width="1440" height="398" rx="20" fill="#ffffff"/><rect x="1" y="1" width="1438" height="396" rx="20" fill="none" stroke="#dce5ef"/><text x="42" y="55" text-anchor="start" font-size="30" font-weight="700" fill="#142a45"><tspan x="42" dy="0">Network ACL 규칙 평가 순서</tspan></text><text x="42" y="90" text-anchor="start" font-size="20" font-weight="400" fill="#5b6e82"><tspan x="42" dy="0">규칙 번호가 낮은 순서로 평가하며, 처음 일치한 규칙을 적용합니다.</tspan></text><rect x="42" y="135" width="664" height="225" rx="18" fill="#fff0f0" stroke="#c44242" stroke-width="2"/><rect x="60" y="151" width="28" height="4" rx="2" fill="#c44242"/><text x="374" y="180" text-anchor="middle" font-size="25" font-weight="700" fill="#172b45"><tspan x="374" dy="0">1. 규칙 50</tspan></text><text x="374" y="222" text-anchor="middle" font-size="20" font-weight="400" fill="#486078"><tspan x="374" dy="0">DENY ICMP</tspan><tspan x="374" dy="28">먼저 검사</tspan></text><rect x="734" y="135" width="664" height="225" rx="18" fill="#ebf8f1" stroke="#21865b" stroke-width="2"/><rect x="752" y="151" width="28" height="4" rx="2" fill="#21865b"/><text x="1066" y="180" text-anchor="middle" font-size="25" font-weight="700" fill="#172b45"><tspan x="1066" dy="0">2. 규칙 100</tspan></text><text x="1066" y="222" text-anchor="middle" font-size="20" font-weight="400" fill="#486078"><tspan x="1066" dy="0">ALLOW ALL</tspan><tspan x="1066" dy="28">앞 규칙에 일치하지 않으면 검사</tspan></text></g></svg>