<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="635" viewBox="0 0 1440 635" role="img" aria-labelledby="title desc"><title id="title">NAT: 요청의 응답과 새로운 접속은 다릅니다</title><desc id="desc">이 실습의 Public NAT Gateway와 IPv4 인터넷 통신 기준</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526c86"/></marker><marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#c44242"/></marker></defs><g font-family="Malgun Gothic, Noto Sans CJK KR, Arial, sans-serif"><rect width="1440" height="635" rx="20" fill="#ffffff"/><rect x="1" y="1" width="1438" height="633" rx="20" fill="none" stroke="#dce5ef"/><text x="42" y="55" text-anchor="start" font-size="30" font-weight="700" fill="#142a45"><tspan x="42" dy="0">NAT: 요청의 응답과 새로운 접속은 다릅니다</tspan></text><text x="42" y="90" text-anchor="start" font-size="20" font-weight="400" fill="#5b6e82"><tspan x="42" dy="0">이 실습의 Public NAT Gateway와 IPv4 인터넷 통신 기준</tspan></text><rect x="45" y="145" width="340" height="120" rx="18" fill="#ebf8f1" stroke="#21865b" stroke-width="2"/><rect x="63" y="161" width="28" height="4" rx="2" fill="#21865b"/><text x="215" y="190" text-anchor="middle" font-size="25" font-weight="700" fill="#172b45"><tspan x="215" dy="0">Private Instance</tspan></text><text x="215" y="232" text-anchor="middle" font-size="20" font-weight="400" fill="#486078"><tspan x="215" dy="0">연결을 먼저 시작</tspan></text><rect x="550" y="145" width="340" height="120" rx="18" fill="#fff3e4" stroke="#bd650c" stroke-width="2"/><rect x="568" y="161" width="28" height="4" rx="2" fill="#bd650c"/><text x="720" y="190" text-anchor="middle" font-size="25" font-weight="700" fill="#172b45"><tspan x="720" dy="0">Public NAT Gateway</tspan></text><text x="720" y="232" text-anchor="middle" font-size="20" font-weight="400" fill="#486078"><tspan x="720" dy="0">Public Subnet</tspan></text><rect x="1055" y="145" width="340" height="120" rx="18" fill="#f1f5f9" stroke="#546579" stroke-width="2"/><rect x="1073" y="161" width="28" height="4" rx="2" fill="#546579"/><text x="1225" y="190" text-anchor="middle" font-size="25" font-weight="700" fill="#172b45"><tspan x="1225" dy="0">Internet</tspan></text><text x="1225" y="232" text-anchor="middle" font-size="20" font-weight="400" fill="#486078"><tspan x="1225" dy="0">외부 서비스</tspan></text><path d="M385,185 L550,185" fill="none" stroke="#526c86" stroke-width="3"  marker-end="url(#arrow)"/><text x="467.5" y="165" text-anchor="middle" font-size="18" font-weight="400" fill="#526c86"><tspan x="467.5" dy="0">요청</tspan></text><path d="M890,185 L1055,185" fill="none" stroke="#526c86" stroke-width="3"  marker-end="url(#arrow)"/><text x="972.5" y="165" text-anchor="middle" font-size="18" font-weight="400" fill="#526c86"><tspan x="972.5" dy="0">IGW 경유</tspan></text><path d="M1055,235 L890,235" fill="none" stroke="#526c86" stroke-width="3"  marker-end="url(#arrow)"/><path d="M550,235 L385,235" fill="none" stroke="#526c86" stroke-width="3"  marker-end="url(#arrow)"/><text x="720" y="315" text-anchor="middle" font-size="24" font-weight="700" fill="#21865b"><tspan x="720" dy="0">기존 요청에 대한 응답은 되돌아올 수 있음</tspan></text><rect x="45" y="410" width="420" height="130" rx="18" fill="#ebf8f1" stroke="#21865b" stroke-width="2"/><rect x="63" y="426" width="28" height="4" rx="2" fill="#21865b"/><text x="255" y="455" text-anchor="middle" font-size="25" font-weight="700" fill="#172b45"><tspan x="255" dy="0">Private Instance</tspan></text><text x="255" y="497" text-anchor="middle" font-size="20" font-weight="400" fill="#486078"><tspan x="255" dy="0">외부에서 직접 연결할 수 없음</tspan></text><rect x="975" y="410" width="420" height="130" rx="18" fill="#f1f5f9" stroke="#546579" stroke-width="2"/><rect x="993" y="426" width="28" height="4" rx="2" fill="#546579"/><text x="1185" y="455" text-anchor="middle" font-size="25" font-weight="700" fill="#172b45"><tspan x="1185" dy="0">Internet</tspan></text><text x="1185" y="497" text-anchor="middle" font-size="20" font-weight="400" fill="#486078"><tspan x="1185" dy="0">새로운 접속 시도</tspan></text><path d="M975,475 L465,475" fill="none" stroke="#c44242" stroke-width="2" stroke-dasharray="6 7"/><circle cx="720" cy="475" r="14" fill="white" stroke="#c44242" stroke-width="2"/><text x="720" y="482" text-anchor="middle" font-size="24" font-weight="700" fill="#c44242"><tspan x="720" dy="0">×</tspan></text><text x="720" y="455" text-anchor="middle" font-size="18" font-weight="400" fill="#c44242"><tspan x="720" dy="0">새 연결 차단</tspan></text><text x="720" y="590" text-anchor="middle" font-size="25" font-weight="700" fill="#172b45"><tspan x="720" dy="0">인터넷으로 나갈 수 있음 ≠ 인터넷에서 직접 들어올 수 있음</tspan></text></g></svg>