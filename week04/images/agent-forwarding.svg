<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="355" viewBox="0 0 1440 355" role="img" aria-labelledby="title desc"><title id="title">SSH Agent Forwarding</title><desc id="desc">vockey2.pem은 Windows PC의 ssh-agent가 사용합니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526c86"/></marker><marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#c44242"/></marker></defs><g font-family="Malgun Gothic, Noto Sans CJK KR, Arial, sans-serif"><rect width="1440" height="355" rx="20" fill="#ffffff"/><rect x="1" y="1" width="1438" height="353" rx="20" fill="none" stroke="#dce5ef"/><text x="42" y="55" text-anchor="start" font-size="30" font-weight="700" fill="#142a45"><tspan x="42" dy="0">SSH Agent Forwarding</tspan></text><text x="42" y="90" text-anchor="start" font-size="20" font-weight="400" fill="#5b6e82"><tspan x="42" dy="0">vockey2.pem은 Windows PC의 ssh-agent가 사용합니다.</tspan></text><rect x="45" y="135" width="363.3333333333333" height="180" rx="18" fill="#f1f5f9" stroke="#546579" stroke-width="2"/><rect x="63" y="151" width="28" height="4" rx="2" fill="#546579"/><text x="226.66666666666666" y="180" text-anchor="middle" font-size="25" font-weight="700" fill="#172b45"><tspan x="226.66666666666666" dy="0">Windows PC</tspan></text><text x="226.66666666666666" y="222" text-anchor="middle" font-size="20" font-weight="400" fill="#486078"><tspan x="226.66666666666666" dy="0">키 파일과 ssh-agent 보관</tspan><tspan x="226.66666666666666" dy="28">labsuser.pem / vockey2.pem</tspan></text><rect x="538.3333333333333" y="135" width="363.3333333333333" height="180" rx="18" fill="#edf5ff" stroke="#2b6cb0" stroke-width="2"/><rect x="556.3333333333333" y="151" width="28" height="4" rx="2" fill="#2b6cb0"/><text x="719.9999999999999" y="180" text-anchor="middle" font-size="25" font-weight="700" fill="#172b45"><tspan x="719.9999999999999" dy="0">Bastion Host</tspan></text><text x="719.9999999999999" y="222" text-anchor="middle" font-size="20" font-weight="400" fill="#486078"><tspan x="719.9999999999999" dy="0">Agent Forwarding 사용</tspan><tspan x="719.9999999999999" dy="28">Private Key 파일 복사 없음</tspan></text><rect x="1031.6666666666665" y="135" width="363.3333333333333" height="180" rx="18" fill="#ebf8f1" stroke="#21865b" stroke-width="2"/><rect x="1049.6666666666665" y="151" width="28" height="4" rx="2" fill="#21865b"/><text x="1213.3333333333333" y="180" text-anchor="middle" font-size="25" font-weight="700" fill="#172b45"><tspan x="1213.3333333333333" dy="0">Private Instance</tspan></text><text x="1213.3333333333333" y="222" text-anchor="middle" font-size="20" font-weight="400" fill="#486078"><tspan x="1213.3333333333333" dy="0">Private Subnet</tspan></text><path d="M408.3333333333333,225 L538.3333333333333,225" fill="none" stroke="#526c86" stroke-width="3"  marker-end="url(#arrow)"/><text x="473.33333333333326" y="179.8" text-anchor="middle" font-size="18" font-weight="400" fill="#526c86"><tspan x="473.33333333333326" dy="0">SSH +</tspan><tspan x="473.33333333333326" dy="25.2">인증 요청 전달</tspan></text><path d="M901.6666666666665,225 L1031.6666666666665,225" fill="none" stroke="#526c86" stroke-width="3"  marker-end="url(#arrow)"/><text x="966.6666666666665" y="205" text-anchor="middle" font-size="18" font-weight="400" fill="#526c86"><tspan x="966.6666666666665" dy="0">SSH / TCP 22</tspan></text></g></svg>